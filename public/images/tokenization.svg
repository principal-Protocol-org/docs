<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 396" width="960" height="396" role="img" aria-labelledby="tok-title tok-desc" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif">
  <title id="tok-title">Tokenization: wrap, split and recombine</title>
  <desc id="tok-desc">The underlying asset is wrapped into SY shares. SY is split into a fixed Principal Token (PT) and a variable Yield Token (YT). Before maturity, equal amounts of PT and YT recombine into SY, and SY unwraps back to the underlying.</desc>
  <defs>
    <marker id="tok-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a5668"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="395" rx="12" fill="#ffffff" stroke="#d3dae3"/>

  <rect x="40" y="90" width="200" height="100" rx="10" fill="#e8ecf1" stroke="#7d8a9c"/>
  <text x="140" y="130" text-anchor="middle" font-size="24" font-weight="700" fill="#0a1626">Underlying</text>
  <text x="140" y="162" text-anchor="middle" font-size="18" fill="#4a5668">e.g. USDY</text>

  <rect x="380" y="90" width="200" height="100" rx="10" fill="#ffffff" stroke="#7d8a9c" stroke-width="2"/>
  <text x="480" y="130" text-anchor="middle" font-size="24" font-weight="700" fill="#0a1626">SY</text>
  <text x="480" y="162" text-anchor="middle" font-size="18" fill="#4a5668">standardized yield</text>

  <rect x="690" y="40" width="230" height="80" rx="10" fill="#0f2a4a"/>
  <text x="805" y="76" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">PT</text>
  <text x="805" y="104" text-anchor="middle" font-size="18" fill="#ffffff">Principal Token · fixed</text>

  <rect x="690" y="160" width="230" height="80" rx="10" fill="#b8862b"/>
  <text x="805" y="196" text-anchor="middle" font-size="24" font-weight="700" fill="#0a1626">YT</text>
  <text x="805" y="224" text-anchor="middle" font-size="18" fill="#0a1626">Yield Token · variable</text>

  <line x1="244" y1="120" x2="376" y2="120" stroke="#4a5668" stroke-width="2.5" marker-end="url(#tok-arrow)"/>
  <text x="310" y="108" text-anchor="middle" font-size="18" font-weight="600" fill="#0a1626">wrap</text>
  <line x1="376" y1="160" x2="244" y2="160" stroke="#4a5668" stroke-width="2.5" marker-end="url(#tok-arrow)"/>
  <text x="310" y="186" text-anchor="middle" font-size="18" font-weight="600" fill="#0a1626">unwrap</text>

  <path d="M584 140 H640 M640 80 V200" fill="none" stroke="#4a5668" stroke-width="2.5"/>
  <path d="M640 80 H686" fill="none" stroke="#4a5668" stroke-width="2.5" marker-end="url(#tok-arrow)"/>
  <path d="M640 200 H686" fill="none" stroke="#4a5668" stroke-width="2.5" marker-end="url(#tok-arrow)"/>
  <text x="612" y="128" text-anchor="middle" font-size="18" font-weight="600" fill="#0a1626">split</text>

  <!-- recombine: PT and YT lines merge at the junction dot, one line returns to SY -->
  <path d="M924 80 H942 V300 H805" fill="none" stroke="#4a5668" stroke-width="2.5"/>
  <path d="M805 244 V300" fill="none" stroke="#4a5668" stroke-width="2.5"/>
  <path d="M805 300 H480 V194" fill="none" stroke="#4a5668" stroke-width="2.5" marker-end="url(#tok-arrow)"/>
  <circle cx="805" cy="300" r="7" fill="#4a5668"/>
  <text x="642" y="332" text-anchor="middle" font-size="18" font-weight="600" fill="#0a1626">recombine equal PT + YT</text>
  <text x="642" y="356" text-anchor="middle" font-size="18" fill="#4a5668">before maturity</text>
</svg>
